<div @slideInLeft>
  <section class="experience">
    <h2>💼 Experiencia Laboral</h2>

    <div class="timeline">
      <div class="entry trigger-cv" id="cv-trigger">
        <div class="details">
          <h3>✨ Oprime aquí para ver mi CV completo</h3>
          <p>Descubre mi trayectoria profesional en logística, ventas y administración.</p>
        </div>
      </div>
    </div>
  </section>

  <div id="cv-overlay">
    <div id="cv-container">
      <span id="close-cv">&times;</span>
      <div class="cv-wrapper" id="cv-wrapper">
        <img src="assets/images/cv-kevin-beta.png" alt="CV de Isis Alejandra" class="cv-image" id="cv-image" />
      </div>
      <p class="zoom-hint">📌 Clic o tocar zona para hacer zoom</p>
      <a href="assets/docs/cv-isis.pdf" download class="download-btn">📥 Descargar CV</a>
    </div>
  </div>
</div>
